# Wren's documentation site, built with zensical (https://zensical.org) and
# published to GitHub Pages by .github/workflows/docs.yml.
# Preview: uvx zensical==0.0.46 serve
# docs/ also holds the untracked working notes (NOTEPAD, ROADMAP, ...). A local
# build renders them off the nav and warns about their links, so --strict only
# passes in CI. They never reach the published site, which CI builds from the
# committed files only.

[project]
site_name = "Wren"
site_description = "A tiny attention-only model that turns commands into tool calls on a CPU."
site_url = "https://stroblme.github.io/wren/"
repo_url = "https://github.com/stroblme/wren"
copyright = "Copyright &copy; 2026 Melvin Strobl &middot; MIT"

# Must stay above the first [project.*] table, or TOML nests it there.
nav = [
  { "Home" = "index.md" },
  { "How-to" = "guide.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
logo = "wren-logo.svg"
favicon = "wren-logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
