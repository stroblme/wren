# Wren's documentation site, built with zensical (https://zensical.org) and
# published to GitHub Pages by .github/workflows/docs.yml.
# Preview: uvx zensical==0.0.72 serve
# Keep local working notes out of previews and published builds alike.

[project]
site_name = "Wren"
site_description = "A tiny attention-only model that turns commands into tool calls on a CPU."
site_url = "https://stroblme.github.io/wren/"
repo_url = "https://github.com/stroblme/wren"
copyright = "Copyright &copy; 2026 Melvin Strobl &middot; MIT"
exclude_docs = """
/DECISIONS.md
/NOTEPAD.md
/RESEARCH.md
/ROADMAP.md
/qfm-relation.md
"""
extra_css = ["stylesheets/extra.css"]

# Must stay above the first [project.*] table, or TOML nests it there.
nav = [
  { "Home" = "index.md" },
  { "How-to" = "guide.md" },
  { "Reference" = "reference.md" },
  { "Development" = "development.md" },
  { "Research and benchmarks" = "research-studies.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
logo = "wren-logo.svg"
favicon = "wren-logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
