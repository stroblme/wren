[project]
name = "wren"
version = "2.0.0"
description = "A tiny attention-only byte-level model for grounded tool calls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melvin Strobl", email = "stroblme@posteo.de" }]
# Inference (`from wren import act`, the `wren` command) runs on the packed
# model in numpy; JAX is for training only.
dependencies = ["numpy>=2"]

[project.optional-dependencies]
train = [
    "flax>=0.12.9",
    "jax>=0.11.1",
    "optax>=0.2.8",
]

[project.scripts]
wren = "wren.cli:main"

[dependency-groups]
cuda12 = ["jax[cuda12]>=0.11.1"]
cuda13 = ["jax[cuda13]>=0.11.1"]
dev = [
    "wren[train]",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fluksio>=0.1.6",
    "kfac-jax>=0.0.8",
    "matplotlib>=3.11.1",
]

[tool.uv.sources]
kfac-jax = { git = "https://github.com/google-deepmind/kfac-jax" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wren"]
# The wheel ships a usable model: the packed demo model the library runs
# (and, as package data, the demo installation it learnt, `wren/home.json`).
artifacts = ["wren/wren.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# Archived studies import wren.home, which was removed in 2.0.
known-first-party = ["wren"]

[tool.ty.src]
# Studies that use the home API removed in 2.0.0. Their code runs at tag
# v1.1.0, as each README's Reproduce section says, and is not checked here.
exclude = [
    "dev/s1_baseline",
    "dev/s8_state_quant",
    "dev/s8b_copy_spectrum",
    "dev/s10_fluksio_tail",
]
