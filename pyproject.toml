[project]
name = "wren"
version = "0.2.0"
description = "A tiny attention-only byte-level model for grounded tool calls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melvin Strobl", email = "stroblme@posteo.de" }]
# Inference (`from wren import act`) runs on the packed model in numpy;
# JAX is for training and the fp32 CLI only.
dependencies = ["numpy>=2"]

[project.optional-dependencies]
train = [
    "flax>=0.12.9",
    "jax>=0.11.1",
    "optax>=0.2.8",
]

[project.scripts]
wren = "wren.cli:main"

[dependency-groups]
cuda12 = ["jax[cuda12]>=0.11.1"]
cuda13 = ["jax[cuda13]>=0.11.1"]
dev = [
    "wren[train]",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fluksio",
    "kfac-jax>=0.0.8",
    "matplotlib>=3.11.1",
]

[tool.uv.sources]
fluksio = { git = "https://git.stroblme.de/Fluksio/app", rev = "8a94bf10d79f7eacc97ad32719a4c00a43d3a317", subdirectory = "backend" }
kfac-jax = { git = "https://github.com/google-deepmind/kfac-jax" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wren"]
# Trained weights live inside the package so the wheel ships a usable model:
# the fp32 JAX weights and the packed ternary model the library runs.
artifacts = ["wren/weights.npz", "wren/wren.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
