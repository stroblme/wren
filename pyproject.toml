[project]
name = "wren"
version = "0.1.0"
description = "A tiny attention-only byte-level model for grounded tool calls"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melvin Strobl", email = "stroblme@posteo.de" }]
dependencies = [
    "flax>=0.12.9",
    "jax>=0.11.1",
    "optax>=0.2.8",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.11.1"]

[project.scripts]
wren = "wren.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fluksio",
    "kfac-jax>=0.0.8",
    "matplotlib>=3.11.1",
]

[tool.uv.sources]
fluksio = { git = "https://git.stroblme.de/Fluksio/app", rev = "6534855492ccee47eb88bcdbeb2f7a12e77a1433", subdirectory = "backend" }
kfac-jax = { git = "https://github.com/google-deepmind/kfac-jax" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wren"]
# Trained weights live inside the package so the wheel ships a usable model.
artifacts = ["wren/weights.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
