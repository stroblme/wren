  <title
     id="title1">Wren logo mark with perch and tail meeting the ring</title>
  <desc
     id="desc1">A rounded wren facing right with a cocked tail whose tip meets the enclosing circle, standing on one leg on a horizontal perch that spans the ring as a chord, drawn in muted taupe tones.</desc>
