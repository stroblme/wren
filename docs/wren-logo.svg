  <title
     id="title1">Wren logo mark with sun and ground inside a ring</title>
  <desc
     id="desc1">A rounded wren facing right with a cocked tail whose tip meets the enclosing circle, resting on gently curved ground beneath a large half sun clipped by the upper-left edge of the ring, drawn in muted taupe and cream tones.</desc>
